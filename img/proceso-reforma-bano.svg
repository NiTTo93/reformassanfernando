  <text x="170" y="257" font-family="Sora, Arial" font-size="20" font-weight="700" fill="#13213B">Visita y toma de medidas</text>
  <text x="170" y="287" font-size="15.5" fill="#5d6b78">Medimos tu baño exactamente y evaluamos bajantes, calentador y toma eléctrica — lo</text>
