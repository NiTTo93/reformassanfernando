  <text x="170" y="257" font-family="Sora, Arial" font-size="20" font-weight="700" fill="#13213B">Diseño con tu estilo</text>
  <text x="170" y="287" font-size="15.5" fill="#5d6b78">Levantamiento + diseño 3D de tu futura cocina: distribución, muebles, encimera y</text>
