  <text x="130" y="62" font-family="Sora, Arial" font-size="30" font-weight="700" fill="#ffffff">Reforma de cocina paso a paso</text>
  <text x="130" y="96" font-size="16" fill="#9fb0cd">Diseño, instalación y entrega con presupuesto cerrado</text>
  <text x="130" y="122" font-size="13" fill="#6c82a8" letter-spacing="1">ISLAREFORMAS · SAN FERNANDO DE LA BAHÍA</text>
