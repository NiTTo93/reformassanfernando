  <text x="170" y="407" font-family="Sora, Arial" font-size="20" font-weight="700" fill="#13213B">Presupuesto por escritura</text>
  <text x="170" y="437" font-size="15.5" fill="#5d6b78">Cada partida al detalle (muebles, encimera, fontanería, electricidad, instalación</text>
